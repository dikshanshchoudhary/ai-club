apiVersion: v1
kind: Namespace
metadata:
  name: security-copilot
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: security-copilot}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: security-copilot/backend:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: security-copilot-secrets}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: workers, namespace: security-copilot}
spec:
  replicas: 2
  selector: {matchLabels: {app: workers}}
  template:
    metadata: {labels: {app: workers}}
    spec:
      containers: [{name: workers, image: security-copilot/backend:latest, command: ["python", "-m", "workers"]}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: security-copilot}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: security-copilot, namespace: security-copilot}
spec:
  rules:
    - http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: api, port: {number: 8000}}}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: security-copilot}
spec:
  selector: {matchLabels: {app: redis}}
  template: {metadata: {labels: {app: redis}}, spec: {containers: [{name: redis, image: redis:7-alpine}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: security-copilot}
spec:
  selector: {matchLabels: {app: postgres}}
  template: {metadata: {labels: {app: postgres}}, spec: {containers: [{name: postgres, image: postgres:16-alpine}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: qdrant, namespace: security-copilot}
spec:
  selector: {matchLabels: {app: qdrant}}
  template: {metadata: {labels: {app: qdrant}}, spec: {containers: [{name: qdrant, image: qdrant/qdrant:latest}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: security-copilot}
spec:
  selector: {matchLabels: {app: prometheus}}
  template: {metadata: {labels: {app: prometheus}}, spec: {containers: [{name: prometheus, image: prom/prometheus:latest}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: security-copilot}
spec:
  selector: {matchLabels: {app: grafana}}
  template: {metadata: {labels: {app: grafana}}, spec: {containers: [{name: grafana, image: grafana/grafana:latest}]}}

